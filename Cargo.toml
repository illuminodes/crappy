[package]
name = "cargo-crappy"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/illuminodes/cargo-crappy"
description = "CRAP metric analysis for Rust — clippy-style diagnostics for change-risk, complexity, coverage, and idiomatic code"
keywords = ["cargo", "testing", "coverage", "complexity", "lint"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]
rust-version = "1.85"

[[bin]]
name = "cargo-crappy"
path = "src/main.rs"

[lints.clippy]
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
bourne = { version = "0.1", package = "json-bourne" }
